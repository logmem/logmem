name: npm package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run ci

      - name: Check package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/mcp-pack.json"
          (cd packages/logmem && npm pack --dry-run --json > "$RUNNER_TEMP/cli-pack.json")
