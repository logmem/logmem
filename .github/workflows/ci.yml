name: ci

# Gate for every PR, and for pushes to main. Feature branches are covered by
# their PR, so pushes there do not trigger a second run.
# Offline only: in-memory backend, no secrets, no deploys.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run spec:check
      - run: npm run conformance
