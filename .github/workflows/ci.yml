name: ci

# Gate for every PR, and for pushes to main and feat/**.
# A feat/** branch that also has an open PR runs this workflow twice: once
# on push (refs/heads/feat/...) and once on pull_request (refs/pull/N/merge).
# Those refs are different concurrency groups, so the two runs do not cancel
# each other. fix/**, cursor/**, and ci/** stay on pull_request alone.
# Offline only: in-memory backend, no secrets, no deploys.

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run spec:check
      - run: npm run conformance
