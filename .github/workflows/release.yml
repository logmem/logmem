name: release

# Restricted release path (direction of the release-guard task, 2026-10-27).
# Release owner and token: antigravity (Layer 0 safety floor, Nov 6 2026).
# Runs quality preflight, then deploys to production using the 'production'
# environment secret VERCEL_TOKEN.
#
# Flow: Actions -> Run workflow on main -> green preflight ->
# deploy job runs with environment: production protection.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release guard (dirty, branch, revision, project target)
        run: node scripts/release-guard.mjs --no-fetch
      - name: Quality gate (test + spec + conformance)
        run: npm run ci

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://logmem.si
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy to production (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
