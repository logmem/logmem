name: dogfood-check

# Daily LogMem dogfood audit (design: docs/superpowers/specs/2026-10-11-logmem-dogfood-design.md).
# Runs the check against the live bridge, writes the checkup entry, and commits
# scorecard.json to the dogfood/scorecard branch. Never touches main.

# schedule and workflow_dispatch run only from the default branch (main).
# Until this file is on main the cron does not fire.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      space:
        description: "space to check; must match ^[a-z0-9_-]{1,60}$"
        default: "madez"

permissions:
  contents: write

concurrency:
  group: dogfood-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        space: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.space)) || fromJSON('["madez","fieldnotes"]') }}
    steps:
      - name: Validate space
        env:
          SPACE: ${{ matrix.space }}
        run: |
          if [[ ! "$SPACE" =~ ^[a-z0-9_-]{1,60}$ ]]; then
            echo "space must match ^[a-z0-9_-]{1,60}$" >&2
            exit 1
          fi
      - name: Code (LogMem dogfood branch)
        uses: actions/checkout@v4
        with:
          ref: feat/dogfood-phase0
          path: code
      - name: Scorecard branch
        uses: actions/checkout@v4
        with:
          ref: dogfood/scorecard
          path: card
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: code
      - name: Run check
        working-directory: code
        env:
          LOGMEM_REST_URL: ${{ secrets.LOGMEM_REST_URL }}
          LOGMEM_REST_TOKEN: ${{ secrets.LOGMEM_REST_TOKEN }}
          SPACE: ${{ matrix.space }}
        run: |
          if [[ ! "$SPACE" =~ ^[a-z0-9_-]{1,60}$ ]]; then
            echo "space must match ^[a-z0-9_-]{1,60}$" >&2
            exit 1
          fi
          node scripts/dogfood-check.mjs --space "$SPACE" --mirror-spaces madez --scorecard "../card/scorecard-${SPACE}.json" > "../check-${SPACE}.json"
      - name: Commit scorecard
        working-directory: card
        env:
          SPACE: ${{ matrix.space }}
        run: |
          if [[ ! "$SPACE" =~ ^[a-z0-9_-]{1,60}$ ]]; then
            echo "space must match ^[a-z0-9_-]{1,60}$" >&2
            exit 1
          fi
          git config user.name "logmem-check"
          git config user.email "logmem-check@users.noreply.github.com"
          git add "scorecard-${SPACE}.json"
          git diff --cached --quiet || git commit -m "scorecard(${SPACE}): $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
      - uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.space }}-${{ github.run_id }}
          path: check-${{ matrix.space }}.json
