<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogMem Dogfood Scorecard</title>
<style>
:root{--bg:#F4F6F5;--surface:#fff;--border:#D3DAD8;--text:#121A19;--muted:#46534F;--brand:#0E6863;--pass:#1E6B35;--pass-bg:#E2F1E5;--fail:#B42318;--fail-bg:#FBE6E3;--gap:#875100;--gap-bg:#FBEED6;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1211;--surface:#121A19;--border:#2B3835;--text:#E9EEEC;--muted:#B3BEBA;--brand:#4FC3B8;--pass:#5DC47C;--pass-bg:#0F2618;--fail:#F47A66;--fail-bg:#341411;--gap:#E8A746;--gap-bg:#2C1F08}}
:root[data-theme="dark"]{--bg:#0C1211;--surface:#121A19;--border:#2B3835;--text:#E9EEEC;--muted:#B3BEBA;--brand:#4FC3B8;--pass:#5DC47C;--pass-bg:#0F2618;--fail:#F47A66;--fail-bg:#341411;--gap:#E8A746;--gap-bg:#2C1F08}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:24px;line-height:30px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.verdict{font-weight:700;font-size:18px}
.pill{font:600 12px/16px var(--mono);padding:3px 8px;border-radius:4px;white-space:nowrap}
.pass{color:var(--pass);background:var(--pass-bg)}.fail{color:var(--fail);background:var(--fail-bg)}.gap{color:var(--gap);background:var(--gap-bg)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:6px;padding:8px 4px;text-align:center;font:600 12px/16px var(--mono)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--border);white-space:nowrap}
th{font:600 11px var(--mono);text-transform:uppercase;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.err{color:var(--fail)}
</style>
</head>
<body>
<main>
  <div class="row">
    <div><h1>LogMem dogfood</h1><div class="sub" id="meta">Loading…</div></div>
    <select id="space" aria-label="Space"><option>madez</option><option>fieldnotes</option></select>
  </div>
  <section class="card"><div class="row"><span class="verdict" id="verdict">…</span><span class="pill" id="deliv"></span></div><p class="sub" id="bar">Pass bar: 7 consecutive passing days (≥3 agents, ≥1 accepted handoff, 0 mirror mismatches, 0 degraded, 0 handoffs unanswered for 24h) plus job logmem-v0-ship done.</p></section>
  <section class="card"><div class="sub" style="margin-bottom:8px">Last 7 days</div><div class="strip" id="strip"></div></section>
  <section class="card scroll"><table><thead><tr><th>Date</th><th>Result</th><th>Agents</th><th>Entries</th><th>Handoffs</th><th>Mismatch</th><th>Unanswered</th><th>Degraded</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{const s=localStorage.getItem("lm-score-space");if(s)$("space").value=s}catch(e){}
async function load(){
  const space=$("space").value;
  try{localStorage.setItem("lm-score-space",space)}catch(e){}
  $("meta").textContent="Loading…";
  try{
    const r=await fetch("/api/scorecard?space="+encodeURIComponent(space),{cache:"no-store"});
    const c=await r.json();
    if(!r.ok)throw new Error(c.error||r.status);
    const days=c.days||[];
    $("meta").textContent=`space ${esc(c.space)} · ${c.checks} checks · updated ${c.generated_at?new Date(c.generated_at).toLocaleString():"never"}`;
    const g=c.gate||{};
    $("verdict").textContent=g.pass?"Gate: PASS":`Gate: not yet (${g.days_passing||0}/7 days passing${g.consecutive?"":", not 7 consecutive yet"})`;
    $("verdict").className="verdict "+(g.pass?"pass":"");
    const d=c.deliverable||{};
    $("deliv").textContent=`${d.job}: ${d.stage}`;$("deliv").className="pill "+(d.stage==="done"?"pass":"gap");
    const last=days.slice(-7);
    $("strip").innerHTML=Array.from({length:7},(_,i)=>{const x=last[i-(7-last.length)];if(!x)return`<div class="day gap">—</div>`;return`<div class="day ${x.pass?"pass":"fail"}" title="${esc(x.date)}">${esc(x.date.slice(5))}<br>${x.pass?"PASS":"FAIL"}</div>`}).join("");
    $("rows").innerHTML=days.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td><span class="pill ${x.pass?"pass":"fail"}">${x.pass?"PASS":x.health_pass?"LOW VOLUME":"FAIL"}</span></td><td>${(x.agents||[]).length}</td><td>${x.entries}</td><td>${x.accepted}/${x.handoffs}</td><td>${x.mirror_checked?x.mirror_mismatches:"n/a"}</td><td>${x.unanswered_24h}</td><td>${x.degraded_sessions}</td></tr>`).join("")||`<tr><td colspan="8" class="sub">No checks yet for this space.</td></tr>`;
  }catch(e){$("meta").innerHTML=`<span class="err">Could not load: ${esc(e.message)}</span>`}
}
$("space").onchange=load;load();
</script>
</body>
</html>
